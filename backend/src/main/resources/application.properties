quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.application.name=comprendia
comprendia.transcripcion.modo=whisper
comprendia.openai.api.clave=${OPENAI_API_KEY}

# LangChain4j (extensión quarkus-langchain4j-openai) — capa de IA
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=60s

quarkus.datasource.db-kind=postgresql
# La conexión se toma de DATABASE_URL (parseada por DatasourceUrlConfigSourceFactory).
# Estos valores son solo el fallback si no se define DATABASE_URL; la contraseña NUNCA va aquí.
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://ep-orange-hill-antfk1v8-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require}
quarkus.datasource.username=${DB_USERNAME:neondb_owner}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
