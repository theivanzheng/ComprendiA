quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.application.name=comprendia
comprendia.transcripcion.modo=whisper
comprendia.openai.api.clave=${OPENAI_API_KEY}

quarkus.datasource.db-kind=postgresql
# El host y la URL se pueden sobreescribir por entorno; la contraseña NUNCA se escribe aquí.
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://ep-orange-hill-antfk1v8-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require}
quarkus.datasource.username=${DB_USERNAME:neondb_owner}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
