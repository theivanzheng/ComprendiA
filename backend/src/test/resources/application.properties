comprendia.transcripcion.modo=simulada
comprendia.openai.api.clave=clave-no-real-para-tests
comprendia.embedding.habilitado=false
comprendia.analisis.gpt.habilitado=false
comprendia.clasificacion.habilitada=false

# LangChain4j: clave ficticia para tests (no se llama a OpenAI en pruebas).
quarkus.langchain4j.openai.api-key=clave-no-real-para-tests
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:comprendia_test;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS VECTOR AS VARCHAR(65535)
quarkus.hibernate-orm.database.generation=drop-and-create
